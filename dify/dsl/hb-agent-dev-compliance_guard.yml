app:
  description: 'M2b 开发联调版语义合规提示；最终出口仍由后端确定性规则审查。'
  icon: 🤖
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: workflow
  name: hb-agent-dev-compliance_guard
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/deepseek:0.0.24@9e12eef09973667f0eaf4f082af883167e1de88740b22e71e71488d020c3778a
    version: null
kind: app
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables: []
  features: {}
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: question-classifier
      id: start-classifier
      source: start
      sourceHandle: source
      target: classifier
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: question-classifier
        targetType: code
      id: classifier-allow-code
      source: classifier
      sourceHandle: '1'
      target: code
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: question-classifier
        targetType: code
      id: classifier-block-code
      source: classifier
      sourceHandle: '2'
      target: code
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: end
      id: code-end
      source: code
      sourceHandle: source
      target: end
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        selected: false
        title: 开始
        type: start
        variables:
        - label: 候选回复
          max_length: 3000
          options: []
          required: true
          type: paragraph
          variable: draft_reply
        - label: 意图
          max_length: 48
          options: []
          required: false
          type: text-input
          variable: intent
        - label: 产品编号
          max_length: 48
          options: []
          required: false
          type: text-input
          variable: product_id
        - label: 渠道
          max_length: 48
          options: []
          required: false
          type: text-input
          variable: channel
      height: 150
      id: start
      position:
        x: 80
        y: 282
      positionAbsolute:
        x: 80
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        classes:
        - id: '1'
          label: allow
          name: 仅当候选回复没有无法核实的产品事实或数字、承诺话术、疑似敏感身份或凭据，也没有把演示内容伪装成真实时，才归类 allow。此分类只是语义提示，不代表后端出口审查放行。
        - id: '2'
          label: block
          name: 包含保证收益、无来源的金额或保障数字、个性化投保结论、疑似身份或凭据，或将演示内容伪装成真实时，归类 block。信息不足或不确定时也归类 block。
        desc: ''
        instructions: ''
        model:
          completion_params:
            frequency_penalty: 0
            max_tokens: 512
            presence_penalty: 0
            temperature: 0
            top_p: 1
          mode: chat
          name: deepseek-flash
          provider: langgenius/deepseek/deepseek
        query_variable_selector:
        - start
        - draft_reply
        selected: false
        title: 问题分类器
        topics: []
        type: question-classifier
        vision:
          enabled: false
      height: 183
      id: classifier
      position:
        x: 380
        y: 282
      positionAbsolute:
        x: 380
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        code: |-
          def main(class_label: str) -> dict:
              if class_label == "allow":
                  return {"decision": "allow", "rules": [], "reply": ""}
              # Unknown, block, and future classes fail closed.
              return {"decision": "block", "rules": ["SEMANTIC_REVIEW_BLOCK"], "reply": ""}
        code_language: python3
        outputs:
          reply:
            children: null
            type: string
          decision:
            children: null
            type: string
          rules:
            children: null
            type: array[string]
        selected: false
        title: 代码执行
        type: code
        variables:
        - value_selector:
          - classifier
          - class_label
          variable: class_label
      height: 150
      id: code
      position:
        x: 680
        y: 282
      positionAbsolute:
        x: 680
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        desc: ''
        outputs:
        - value_selector:
          - code
          - decision
          value_type: string
          variable: decision
        - value_selector:
          - code
          - rules
          value_type: array[string]
          variable: rules
        - value_selector:
          - code
          - reply
          value_type: string
          variable: reply
        selected: false
        title: 输出审查结果
        type: end
      height: 160
      id: end
      position:
        x: 980
        y: 282
      positionAbsolute:
        x: 980
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    viewport:
      x: 0
      y: 0
      zoom: 1
  rag_pipeline_variables: []
